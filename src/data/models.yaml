# Models. Schema: src/schemas/data.ts (modelSchema).
# Spec: docs/04-data-schemas.md
#
# NO BENCHMARK SCORE FIELDS. Ever. See docs/00-product-brief.md for the reasoning.
# external_signals holds attributed links with a qualitative note, never a score.
#
# Claude models: verified live 2026-08-23 against platform.claude.com/docs (Tier 1).
# OpenAI models: pricing/context verified live 2026-08-23 against developers.openai.com
# (Tier 1). Their `available_on` mapping to ChatGPT consumer plans is NOT independently
# confirmed — see the community-reported caveat on the chatgpt-* plans in plans.yaml.
#
# Known schema limitation (flagged for Themis / future work, not fixed this task):
# unlike plans, models have no `confidence` field, so a model's own pricing/spec can be
# solidly Tier-1 sourced while its plan-availability mapping is genuinely uncertain, with
# no per-field way to say so on the model record itself. The caveat lives on the plan side
# instead (plans.yaml billing_notes).

