    - Codex, reported 5x-10x higher limits than Plus
    - Reported time-limited 10x Codex launch promo through 2026-05-31 (likely expired as
      of this verification date — not re-checked)
  limit_windows:
    - window_id: weekly
      duration_hours: 168
      unit: opaque
      stated_capacity: null
      applies_to: [codex]
      note: "Reported 5x-10x Plus's Codex limits. Not independently confirmed this pass."
  limit_style: mixed
  limit_style_note: >
    Same reported pattern as Plus, at a higher ceiling. Not independently confirmed —
    verify before relying on this for a purchase decision.
  good_for:
    - Heavy Codex users who have already confirmed Plus isn't enough
  not_for:
    - Anyone for whom Plus's limits haven't been a problem
  source_url: https://help.openai.com/en/articles/11369540-using-codex-with-your-chatgpt-plan
  last_verified: 2026-08-23
  confidence: community-reported
