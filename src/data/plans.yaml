  provider: OpenAI
  display_name: ChatGPT Pro
  tier: high
  price_usd_month: 100
  billing_notes: >
    COMMUNITY-REPORTED, not independently Tier-1 confirmed. Reported as two distinct
    price points both called "Pro" — $100/month (Codex included, without unlimited Sora)
