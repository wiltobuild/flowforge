name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0

      - name: Restore Node modules and Chromium
        id: dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # astro check validates all content collection schemas before Astro builds.
      - name: Build and validate schemas with zero warnings
        run: npm run check:build

      - name: Enforce concepts neutrality
        run: npm run check:concepts

      - name: Check rendered internal links
        run: npm run check:links

      - name: Scan rendered pages for accessibility violations
        run: npm run check:a11y
